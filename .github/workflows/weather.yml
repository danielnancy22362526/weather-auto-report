name: Weekly Weather Report

on:
  # 定時排程：UTC 07:00 = 台灣時間每週三 15:00
  schedule:
    - cron: '0 7 * * 3'
  # 允許在 GitHub 網頁上手動點擊執行（方便測試）
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 賦予將產出的 Excel 存回 GitHub 的權限

    steps:
      # 1. 抓取儲存庫程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安裝執行所需的套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests matplotlib openpyxl

      # 4. 執行天氣抓取腳本
      - name: Run temp.py
        run: python temp.py

      # 5. 將產出的 Excel 報表自動存回 GitHub 儲存庫中
      - name: Commit and push generated report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly weather report [skip ci]" && git push)

      # 6. (選填) 將 Excel 報表上傳為下載附件（Artifacts）
      - name: Upload Excel as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-weather-report
          path: "*.xlsx"
